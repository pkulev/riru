name: Version bump

on:
  workflow_dispatch:
    inputs:
      atom:
        description: Package atom (category/package)
        required: true
        type: string
      version:
        description: New version
        required: true
        type: string
      base:
        description: Base version to copy (optional; defaults to latest)
        required: false
        type: string
  issues:
    # labeled only: creating an issue with the template label already fires
    # "labeled"; listening to "opened" as well double-runs the job.
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  bump:
    name: Bump ebuild version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'version-bump'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Babashka
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: latest

      - name: Resolve bump parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ATOM: ${{ github.event.inputs.atom }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BASE: ${{ github.event.inputs.base }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: bb ci:bump-params

      - name: Install pkgdev
        run: pip install pkgdev

      - name: Copy ebuild
        env:
          ATOM: ${{ steps.params.outputs.atom }}
          VERSION: ${{ steps.params.outputs.version }}
          BASE: ${{ steps.params.outputs.base }}
        run: |
          set -euo pipefail
          args=(--atom "$ATOM" --version "$VERSION" --skip-manifest --skip-readme)
          if [ -n "${BASE:-}" ]; then
            args+=(--base "$BASE")
          fi
          bb bump:version "${args[@]}"

      - name: Update Manifest
        id: manifest
        continue-on-error: true
        env:
          ATOM: ${{ steps.params.outputs.atom }}
          VERSION: ${{ steps.params.outputs.version }}
        run: |
          set -euo pipefail
          category="${ATOM%%/*}"
          package="${ATOM#*/}"
          mkdir -p distdir
          PORTDIR_OVERLAY="$GITHUB_WORKSPACE" \
            pkgdev manifest -d "$GITHUB_WORKSPACE/distdir" \
            "${category}/${package}/${package}-${VERSION}.ebuild"

      - name: Refresh README package index
        run: bb readme:packages

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bump/${{ steps.params.outputs.branch_slug }}-${{ steps.params.outputs.version }}
          commit-message: |
            ${{ steps.params.outputs.atom }}: bump version to ${{ steps.params.outputs.version }}

            **Closes:** \#{{ github.event.issue.number }}
          title: "${{ steps.params.outputs.atom }}: bump version to ${{ steps.params.outputs.version }}"
          body: |
            Automated version bump.

            - Copied to `${{ steps.params.outputs.version }}` (base: `${{ steps.params.outputs.base || 'latest' }}`)
            - Regenerated README package index
            - Previous ebuild versions were left in place
            ${{ steps.manifest.outcome == 'failure' && format('- **Manifest update failed** — for Rust packages: `bb bump:crates --pkg-atom {0} --version {1} --skip-manifest`, then add the `deps-uploaded` label so CI refreshes Manifest.', steps.params.outputs.atom, steps.params.outputs.version) || '- Regenerated Manifest' }}

            Please review SRC_URI, keywords, and dependencies before merging.

            **Closes:** \#${{ github.event.issue.number }}
          labels: version-bump
